services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecp_user
      POSTGRES_PASSWORD: ecp_password
      POSTGRES_DB: police_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 300m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Cap Redis at 900 MB and evict least-recently-used keys when full.
    # At 200 msg/s × 10-min idempotency TTL: ~120K idempotency keys ≈ 20 MB max.
    command: redis-server --maxmemory 900mb --maxmemory-policy allkeys-lru
    mem_limit: 1g

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_HEAP_OPTS: "-Xmx256m -Xms128m"
    mem_limit: 400m

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      # Keep only last 24h of messages and cap per-partition at 256MB to control disk usage
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 67108864
    mem_limit: 800m

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      kafka-topics --bootstrap-server kafka:9092 --list

      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic police-telemetry --replication-factor 1 --partitions 50
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic police-telemetry-retry --replication-factor 1 --partitions 50
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic police-telemetry-dlq --replication-factor 1 --partitions 50

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    mem_limit: 300m

  # Microservices
  device-service:
    build:
      context: .
      dockerfile: device-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/police_db
      SPRING_DATASOURCE_USERNAME: ecp_user
      SPRING_DATASOURCE_PASSWORD: ecp_password
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: device-service
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    mem_limit: 512m

  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: event-service
      OTEL_PROPAGATORS: tracecontext,baggage
      # Consumer concurrency: 5 threads × 10 partitions each = full 50-partition coverage.
      # Raise to 10 if lag returns; keep ≤ partition count (50).
      KAFKA_CONSUMER_CONCURRENCY: 5
      KAFKA_RETRY_CONSUMER_CONCURRENCY: 2
      # 25 records/poll keeps per-thread batch small; tune up once throughput is stable.
      KAFKA_MAX_POLL_RECORDS: 25
      # 10% trace sampling reduces OTEL serialization overhead by ~90% at 500 msg/s.
      # Set to 1.0 temporarily when debugging a specific issue.
      OTEL_TRACE_SAMPLING_PROBABILITY: "0.1"
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      - kafka
      - redis
      - kafka-init
      - otel-collector
    mem_limit: 512m

  sim-service:
    build:
      context: .
      dockerfile: sim-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POLICE_SIMULATOR_DEVICE_COUNT: 1000
      POLICE_SIMULATOR_INTERVAL_MS: 5000
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: sim-service
      OTEL_PROPAGATORS: tracecontext,baggage
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      - kafka
      - kafka-init
      - otel-collector
    mem_limit: 512m

  command-service:
    build:
      context: .
      dockerfile: command-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/police_db
      SPRING_DATASOURCE_USERNAME: ecp_user
      SPRING_DATASOURCE_PASSWORD: ecp_password
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: command-service
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    mem_limit: 512m

  # ══════════════════════════════════════════════════════════════
  # DASHBOARD (Police Command Center UI)
  # ══════════════════════════════════════════════════════════════

  dashboard:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./dashboard.html:/usr/share/nginx/html/dashboard.html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - device-service
      - event-service
    mem_limit: 32m

  # ══════════════════════════════════════════════════════════════
  # OBSERVABILITY STACK
  # ══════════════════════════════════════════════════════════════

  # ── Prometheus — scrapes /actuator/prometheus from all services ──
  prometheus:
    image: prom/prometheus:v2.48.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.wal-compression'
      - '--query.max-concurrency=2'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    mem_limit: 512m

  # ── Grafana — dashboards for JVM heap, p95/p99, Kafka lag ──
  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 256m

  # ── Elasticsearch — stores logs from Logstash ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false       # disabled for local dev only
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1536m

  # ── Logstash — receives logs via TCP :5000, parses, ships to ES ──
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    restart: unless-stopped
    ports:
      - "5010:5000"     # TCP input (from LOGSTASH_TCP appender) — host 5010 because macOS AirPlay owns 5000
      - "5001:5001/udp" # UDP input (optional syslog)
      - "9600:9600"     # Logstash monitoring API
    volumes:
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 768m

  # ── Kibana — visualise logs from Elasticsearch ──
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 800m

  # ── OpenTelemetry Collector — receives traces from services, forwards to
  #    Jaeger, and generates SpanMetrics (RED: rate/error/duration) for
  #    Prometheus.  This is what feeds the Jaeger Monitor tab. ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    restart: unless-stopped
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "8889:8889"   # Prometheus span-metrics exporter (Prometheus scrapes here)
    depends_on:
      - jaeger
    mem_limit: 256m

  # ── Jaeger — distributed tracing UI ──
  jaeger:
    image: jaegertracing/all-in-one:1.52
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP (direct access / backwards compat)
      - "14269:14269"   # Admin HTTP (Prometheus scrapes internal Jaeger metrics)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "10000"
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
      PROMETHEUS_QUERY_SUPPORT_SPANMETRICS_CONNECTOR: "true"
      PROMETHEUS_QUERY_NORMALIZE_CALLS: "true"
      PROMETHEUS_QUERY_NORMALIZE_DURATION: "true"
    depends_on:
      - prometheus
    mem_limit: 512m

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    deploy:
      resources:
        limits:
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080"
    privileged: true
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://ecp_user:ecp_password@postgres:5432/police_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  grafana_data:
  elasticsearch_data:
