spring:
  application:
    name: event-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    consumer:
      group-id: police-event-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      observation-enabled: true
      # Limit records returned per poll per partition-thread to bound processing latency.
      # 500 msg/s ÷ 5 threads = 100 msg/s per thread; 25 records/poll at ~2ms each = ~50ms/poll cycle.
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:25}
      # Prevent one slow partition from stalling the fetch for others
      properties:
        fetch.min.bytes: 16384              # wait for 16 KB before returning an empty poll
        fetch.max.wait.ms: 500
        max.partition.fetch.bytes: 131072   # 128 KB per partition (default is 1 MB × 50 = 50 MB buffer)
        max.poll.interval.ms: 300000        # 5 min — explicit; keep above worst-case retry sleep
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: all
      observation-enabled: true

server:
  port: 8083
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:20}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}

management:
  tracing:
    sampling:
      # 100% sampling at 500 msg/s = ~500 spans/s of OTEL overhead. 10% is sufficient for
      # latency profiling while reducing serialization/export CPU by ~90%.
      probability: ${OTEL_TRACE_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,env,loggers,threaddump,heapdump,scheduledtasks"
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: always
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,redis
        startup:
          include: readinessState
    # Allow log-level changes at runtime without restart (safe for prod debugging)
    loggers:
      enabled: true
  # ── Tag every metric with service name + environment ──────────────────────
  # Visible in Prometheus as: http_server_requests_seconds{service="event-service",env="prod",...}
  metrics:
    tags:
      service: ${spring.application.name}
      env: ${spring.profiles.active:default}
    # ── Enable p50/p95/p99 histogram buckets for all HTTP endpoints ──────────
    distribution:
      percentiles-histogram:
        http.server.requests: true
        resilience4j.circuitbreaker.calls: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        resilience4j.circuitbreaker.calls: 0.5, 0.95, 0.99
      # SLO buckets — "how many requests finished under 50ms / 100ms / 500ms?"
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
    # ── Enable all JVM metrics (heap, GC, threads, classloader) ─────────────
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      kafka: true
      hikaricp: true
      resilience4j: true

resilience4j:
  circuitbreaker:
    instances:
      redisReadOps:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      redisWriteOps:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      redisReadOps:
        maxAttempts: 3
        waitDuration: 200ms
      redisWriteOps:
        maxAttempts: 3
        waitDuration: 200ms
  ratelimiter:
    instances:
      redisReadOps:
        limitForPeriod: 300
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  bulkhead:
    instances:
      redisReadOps:
        maxConcurrentCalls: 100
        maxWaitDuration: 0
      redisWriteOps:
        maxConcurrentCalls: 100
        maxWaitDuration: 0

police:
  event:
    idempotency:
      # 10-min TTL covers Kafka at-least-once retry window (seconds); shorter than 1h prevents key flood.
      # At 200 msg/s × 600s = 120K keys max ≈ 20 MB — safe for a 512m Redis limit.
      ttl: ${POLICE_EVENT_IDEMPOTENCY_TTL:PT10M}
  kafka:
    topics:
      telemetry: police-telemetry
      telemetry-retry: police-telemetry-retry
      telemetry-dlq: police-telemetry-dlq
    consumer:
      # Tune via env vars without rebuild. Must not exceed partition count (50).
      # Rule of thumb: cores × 1.5, capped at 10 on memory-constrained hosts (each thread ~50 MB).
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:5}
      retry-concurrency: ${KAFKA_RETRY_CONSUMER_CONCURRENCY:2}
    retry:
      main:
        attempts: 2
        backoff-ms: 1000
      retry-topic:
        attempts: 2
        backoff-ms: 2000
