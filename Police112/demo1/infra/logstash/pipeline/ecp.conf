# ══════════════════════════════════════════════════════════════════
# Logstash pipeline for Oracle ECP microservices
#
# Flow:
#   Spring Boot (JSON via TCP :5000)
#       → Logstash (parse + enrich)
#           → Elasticsearch (index: police-ecp-{service}-{date})
#
# Interview talking point:
#   "Each service gets its own daily index pattern in ES so we can
#    set different retention policies — security audit logs kept 1 year,
#    application logs kept 30 days. Kibana index patterns are
#    police-ecp-* for all, police-ecp-security-* for audit-only."
# ══════════════════════════════════════════════════════════════════

input {
  # Receives JSON from logback LogstashTcpSocketAppender
  tcp {
    port => 5000
    codec => json_lines
  }
  # Optional: also accept UDP syslog from infrastructure
  udp {
    port => 5001
    codec => json
  }
}

filter {
  # ── Parse timestamp from the JSON field written by logback ──────
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # ── Route SECURITY_AUDIT events to a separate index ─────────────
  if [logger] == "SECURITY_AUDIT" {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "police-ecp-security" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "police-ecp-%{service}" }
    }
  }

  # ── Normalize missing fields to avoid ES mapping conflicts ───────
  mutate {
    convert => { "duration_ms" => "integer" }
    convert => { "status"      => "integer" }
  }

  # ── Drop health-check noise ──────────────────────────────────────
  if [uri] =~ /\/actuator\/health/ {
    drop {}
  }
}

output {
  elasticsearch {
    hosts            => ["elasticsearch:9200"]
    # Daily index rotation: police-ecp-event-service-2026.06.04
    index            => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    # Lifecycle policy (ILM) — hot for 7d, warm for 23d, then delete
    ilm_enabled      => true
    ilm_rollover_alias => "police-ecp"
    ilm_policy       => "police-ecp-30d-policy"
  }

  # stdout for debugging Logstash itself in dev
  # stdout { codec => rubydebug }
}
