---
apiVersion: 1

policies:
  - orgId: 1
    receiver: Slack Police112
    group_by: ['alertname', 'job']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: Slack Police112
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h
      - receiver: Slack Police112
        matchers:
          - severity = warning
        group_wait: 60s
        repeat_interval: 6h
