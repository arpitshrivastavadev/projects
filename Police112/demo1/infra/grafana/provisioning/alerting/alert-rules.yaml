---
apiVersion: 1

groups:
  - orgId: 1
    name: Critical Alerts
    folder: Police112
    interval: 1m
    rules:

      # Fires SEPARATELY for each service that goes down
      - uid: alert-container-down
        title: Container Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: up{job=~"device-service|event-service|command-service|sim-service"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "🚨 {{ $labels.job }} is DOWN"
          description: "Service {{ $labels.job }} (instance: {{ $labels.instance }}) has been unreachable for more than 1 minute. Check: docker compose ps | grep {{ $labels.job }}"

      # Fires with actual disk % value
      - uid: alert-disk-critical
        title: Disk Usage Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round((1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "💾 Disk usage is {{ $values.A }}% — CRITICAL"
          description: "Ubuntu PC disk usage is at {{ $values.A }}%. Risk of application crash! Run: df -h && docker system prune -f"

      # Fires SEPARATELY for each service with its heap %
      - uid: alert-heap-critical
        title: JVM Heap Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round((jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "☕ {{ $labels.job }} Heap at {{ $values.A }}% — CRITICAL"
          description: "Service {{ $labels.job }} heap is at {{ $values.A }}%. OOM crash imminent! Check Grafana JVM dashboard immediately."

      # Fires per topic with actual lag number
      - uid: alert-kafka-lag-critical
        title: Kafka Consumer Lag Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: sum by (topic) (kafka_consumer_fetch_manager_records_lag{job="event-service"})
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [50000]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "📨 Kafka lag {{ $values.A }} on {{ $labels.topic }} — CRITICAL"
          description: "Topic {{ $labels.topic }} consumer lag is {{ $values.A }}. event-service cannot keep up with telemetry. Check Grafana Kafka dashboard."

  - orgId: 1
    name: Warning Alerts
    folder: Police112
    interval: 1m
    rules:

      - uid: alert-disk-warning
        title: Disk Usage Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round((1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [70]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "💾 Disk usage at {{ $values.A }}% — Warning"
          description: "Ubuntu PC disk at {{ $values.A }}%. Plan cleanup before hitting 85% critical threshold. Run: df -h"

      - uid: alert-heap-warning
        title: JVM Heap Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round((jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [70]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "☕ {{ $labels.job }} Heap at {{ $values.A }}% — Warning"
          description: "Service {{ $labels.job }} heap at {{ $values.A }}%. Monitor closely — critical alert fires at 85%."

      - uid: alert-kafka-lag-warning
        title: Kafka Consumer Lag Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: sum by (topic) (kafka_consumer_fetch_manager_records_lag{job="event-service"})
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [10000]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "📨 Kafka lag {{ $values.A }} on {{ $labels.topic }} — Warning"
          description: "Topic {{ $labels.topic }} consumer lag is {{ $values.A }}. event-service processing slowing down. Monitor Grafana Kafka dashboard."

      - uid: alert-postgres-connections
        title: PostgreSQL Connection Pool Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round((hikaricp_connections_active / hikaricp_connections_max) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "🗄️ {{ $labels.job }} DB pool at {{ $values.A }}% — Warning"
          description: "Service {{ $labels.job }} HikariCP pool at {{ $values.A }}%. Risk of connection timeout under load."

      - uid: alert-redis-memory
        title: Redis Memory Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round(redis_memory_used_bytes / 1024 / 1024)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [400]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "⚡ Redis using {{ $values.A }}MB — Warning"
          description: "Redis memory at {{ $values.A }}MB. Consider adding: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru"

      - uid: alert-cpu-warning
        title: High CPU Usage Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "🖥️ Ubuntu CPU at {{ $values.A }}% — Warning"
          description: "CPU usage at {{ $values.A }}% sustained for 5+ minutes. Check which container is consuming: docker stats --no-stream"

      - uid: alert-error-rate
        title: High Error Rate Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: round(sum by (job) (increase(logback_events_total{level="error"}[1m])))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [50]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "❌ {{ $labels.job }} — {{ $values.A }} errors/min"
          description: "Service {{ $labels.job }} logging {{ $values.A }} errors/min. Check Kibana: http://192.168.1.6:5601 → filter by service={{ $labels.job }} level=ERROR"

      - uid: alert-service-restart
        title: Service Restart Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: changes(process_start_time_seconds{job=~"device-service|event-service|command-service|sim-service"}[10m])
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "🔄 {{ $labels.job }} restarted unexpectedly"
          description: "Service {{ $labels.job }} restarted in the last 10 minutes. Check logs: docker compose logs {{ $labels.job }} --tail 50"

      - uid: alert-gc-pause
        title: GC Pause Too Long
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              expr: jvm_gc_pause_seconds_max
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.5]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: NoData
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "⏱️ {{ $labels.job }} GC pause {{ $values.A }}s — Warning"
          description: "Service {{ $labels.job }} GC pause is {{ $values.A }}s (threshold: 0.5s). Users may experience latency spikes. Check Grafana JVM dashboard."
