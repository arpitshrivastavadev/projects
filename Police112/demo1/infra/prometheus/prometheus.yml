global:
  scrape_interval:     15s   # pull metrics every 15 seconds
  evaluation_interval: 15s
  # Attach these labels to every time series scraped — visible in Grafana
  external_labels:
    cluster: 'ecp-local'

# ── Alert rule files (add when you create Grafana alerting rules) ──
# rule_files:
#   - /etc/prometheus/alerts/*.yml

scrape_configs:

  # ── Self-monitoring ──────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── ECP Microservices ────────────────────────────────────────────
  # Each service exposes /actuator/prometheus automatically via
  # micrometer-registry-prometheus + spring-boot-starter-actuator.
  #
  # Metrics you get for FREE:
  #   JVM heap:      jvm_memory_used_bytes{area="heap"}
  #   GC pauses:     jvm_gc_pause_seconds_*
  #   Threads:       jvm_threads_live_threads
  #   HTTP latency:  http_server_requests_seconds_bucket (for p95/p99)
  #   DB pool:       hikaricp_connections_active
  #   Kafka:         spring_kafka_listener_seconds_*
  #   Resilience4j:  resilience4j_circuitbreaker_state
  - job_name: 'device-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['device-service:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'event-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['event-service:8083']

  - job_name: 'command-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['command-service:8082']

  - job_name: 'sim-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sim-service:8084']
